<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Center Planet / Nucleus -->
  <circle cx="50" cy="50" r="16.5" fill="#0F172A" />
  
  <!-- Orbit 1: Vertical tilted slightly -->
  <g transform="rotate(-6 50 50)">
    <ellipse cx="50" cy="50" rx="21" ry="43" stroke="#0F172A" stroke-width="3.2" />
  </g>
  
  <!-- Orbit 2: Diagonal -->
  <g transform="rotate(38 50 50)">
    <ellipse cx="50" cy="50" rx="43" ry="22" stroke="#0F172A" stroke-width="3.2" />
  </g>
  
  <!-- Orbit 3: Shallow horizontal tilt -->
  <g transform="rotate(-18 50 50)">
    <ellipse cx="50" cy="50" rx="46" ry="16" stroke="#0F172A" stroke-width="3.2" />
  </g>
</svg>