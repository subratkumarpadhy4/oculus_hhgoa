<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malicious QR (Quishing) Test</title>
    <!-- Load QR Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #fff5f5;
            color: #721c24;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            text-align: center;
            margin: 40px auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border: 2px solid #f5c6cb;
        }

        canvas {
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }

        .threat-pill {
            background: #f8d7da;
            color: #721c24;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚨 Malicious QR Code (Quishing)</h1>
        <p>Target URL: <strong>http://bit.ly/secure-paypal-login</strong></p>

        <!-- Canvas for dynamic generation -->
        <canvas id="qrCanvas"></canvas>

        <div class="threat-pill">
            ⚠️ Trigger: Unknown Non-HTTPS URL & Shortener
        </div>
        <p style="font-size:12px; color:#856404; margin-top: 15px;">
            The Oculus Risk Engine scans this QR and detects:
            <br>• Unknown domain (+30)
            <br>• URL shortener (+20)
            <br>• Insecure HTTP (+20)
            <br><strong>Expected: Red Alert / "Suspicious QR Detected" toast</strong>
        </p>
    </div>

    <script>
        (function () {
            var qr = new QRious({
                element: document.getElementById('qrCanvas'),
                value: 'http://bit.ly/secure-paypal-login',
                size: 220,
                level: 'H'
            });
        })();
    </script>
</body>

</html>
